<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tweakpane Addons Example</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #split-root {
            width: 100vw;
            height: 100vh;
        }

        #liveview {
            background: #181818;
            color: #b5e853;
            height: 100%;
        }

        #liveview h3 {
            margin-top: 0;
        }

        #livecode {
            background: #222;
            color: #b5e853;
            padding: 10px;
            border-radius: 6px;
            min-height: 200px;
            display: block;
        }
    </style>
</head>

<body>
    <div id="split-root"></div>
    <script type="module">
        import { SplitPane } from './splitpane/splitpane.js';
        import { propertyTable } from './propertytable/propertytable.js';

        // Create the splitpane
        const split = new SplitPane(document.getElementById('split-root'), {
            orientation: 'horizontal',
            splitRatio: 0.5,
            minSize: 200
        });

        // Left panel: property table
        const menu1 = document.createElement('div');
        menu1.id = 'menu1';
        menu1.style.height = '100%';
        split.getPanel(1).appendChild(menu1);

        let MENU1 = new propertyTable({
            container: menu1,
            title: 'Propertytable Example',
            expanded: true,
        });

        let fixedProperties = {
            float: 1.23,
            float2: 3,
            vec2: { x: 0.1, y: 0.2 },
            vec3: { x: 0.1, y: 0.2, z: 0.3 },
            vec4: { x: 0.1, y: 0.2, z: 0.3, w: 0.4 },
            color: {r:0,g:0,b:1,a:1},
            nested:{
                expandable: true,
                anotherfloat:4.56,
                vec2: { x: 0.5, y: 0.6 },
            },
            
            color2: '#00ff00',
            check: false,
            text: "Hello World\n new line ",
            glslShader: `#version 300 es
precision mediump float;

uniform float u_time;
uniform vec2 u_resolution;
uniform vec3 u_color;

out vec4 fragColor;

void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    vec3 color = u_color * sin(u_time + uv.x * 10.0);
    fragColor = vec4(color, 1.0);
}`,
            glslWithLineNumbers: `#version 300 es
precision mediump float;

uniform float u_time;
uniform vec2 u_resolution;
uniform vec3 u_color;

out vec4 fragColor;

void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    vec3 color = u_color * sin(u_time + uv.x * 10.0);
    fragColor = vec4(color, 1.0);
}`,
        }

        let flexible = {
            A: 1.23,
            B: 3,
            C: { x: 0.1, y: 0.2 },
            vec3: { x: 0.1, y: 0.2, z: 0.3 },
            vec4: { x: 0.1, y: 0.2, z: 0.3, w: 0.4 },
            color: {r:0,g:0,b:1,a:1}
        }

        let options = {
            float: { removable: true, min: 0, max: 10, step: 0.01 },

            vec2: { x: { min: -10, max: 20, step: 0.01 }, y: { min: -10, max: 10, step: 0.01 } },
            vec3: { x: { min: -10, max: 20, step: 0.01 }, y: { min: -10, max: 10, step: 0.01 }, z: { min: -10, max: 10, step: 0.01 } },
            vec4: { x: { min: -10, max: 10, step: 0.01 }, y: { min: -10, max: 10, step: 0.01 }, z: { min: -10, max: 10, step: 0.01 }, w: { min: 0, max: 1, step: 0.01 } },
            //color: {color: {type: 'float'}},
            text: { multiline: true, rows: 5 },
            glslShader: {
                multiline: true,
                rows: 12,
                wordwrap: false,
                highlighting: 'glsl'
            },
           
        }



        const fixedFolder = MENU1.addFolder({
            title: "Fixed Properties",
            expandable: false,
            object: fixedProperties,
            options: options,
            expanded: true,
            onChange:_=>console.log(fixedProperties.color)
        })

        // Make the folder expandable after creation using the public method
  /*    
        MENU1.addFolder({
            title: "flexible Properties",
            expandable: true,
            object: flexible,
            options: options
        })
            */
/*
MENU1.addBinding(fixedProperties,"glslWithLineNumbers", {
                multiline: true,
                rows: 12,
                wordwrap: false,
                highlighting: 'glsl',
                lineNumbers: true
            },).on('change', (value) => {
                console.log("GLSL with line numbers changed:", value);
            });
*/
        Object.assign(MENU1.element.style, { fontFamily: 'Arial', fontSize: '13px', width: '100%' })

        // A TABLE OF BOXES (boxes: true): each top-level folder a box, an icon before a title, a folder inside a box
        // set in; the colours are --pt-box-* custom properties, here left to Tweakpane's theme
        const boxesEl = document.createElement('div');
        menu1.appendChild(boxesEl);
        const BOXES = new propertyTable({ container: boxesEl, boxes: true });
        Object.assign(BOXES.element.style, { fontFamily: 'Arial', fontSize: '13px', width: '100%' });
        const boxed = { exposure: 0.5, bounces: 8, preview: true, colour: { r: 1, g: 0.8, b: 0.4 }, radius: 2, samples: 16 };
        const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><circle cx="12" cy="12" r="4"/>'
            + '<path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>';
        const light = BOXES.addFolder({ title: 'Light', icon: sun });
        light.addBinding(boxed, 'exposure', { min: 0, max: 1 });
        light.addBinding(boxed, 'colour', { color: { type: 'float' } });
        const more = light.addFolder({ title: 'more', expanded: false });
        more.addBinding(boxed, 'radius', { min: 0, max: 10 });
        const paths = BOXES.addFolder({ title: 'Paths' });
        paths.addBinding(boxed, 'bounces', { min: 1, max: 32, step: 1 });
        paths.addBinding(boxed, 'preview');
        paths.addBinding(boxed, 'samples', { min: 1, max: 256, step: 1 });


        // Right panel: live view
        const liveview = document.createElement('div');
        liveview.id = 'liveview';
        liveview.innerHTML = `
            <h3>Live PropertyTable Data</h3>
            <pre><code id="livecode">{}</code></pre>
        `;
        split.getPanel(2).appendChild(liveview);

        // Live update code block
        const livecode = liveview.querySelector('#livecode');
        function updateLiveView() {
            livecode.textContent = "FIXED:"+JSON.stringify(fixedProperties, null, 2);
            livecode.textContent += "\n\nFLEX:"+JSON.stringify(flexible, null, 2);
        }
        updateLiveView();
        setInterval(updateLiveView, 300);
    </script>
</body>

</html>
